<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FixMyCar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard-styles.css">
</head>
<body class="dashboard">
    <div class="dashboard-container">
        <!-- ========== SECCIÓN: Barra lateral cliente (.sidebar · dashboard-styles.css) ========== -->
        <aside class="sidebar" id="sidebar">
            <!-- Item: marca sidebar (.logo-container) -->
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fas fa-car"></i>
                </div>
                <h1>FixMyCar</h1>
            </div>

            <!-- Item: menú navegación (.sidebar-nav) -->
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a href="vehicles.html" class="nav-item">
                    <i class="fas fa-car"></i>
                    <span>Mis Vehículos</span>
                </a>
                <a href="search-workshops.html" class="nav-item">
                    <i class="fas fa-search"></i>
                    <span>Buscar Taller</span>
                </a>
                <a href="appointments.html" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Mis Citas</span>
                </a>
            </nav>

            <!-- Item: perfil usuario sidebar (.user-profile) -->
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <span class="user-name" id="sidebarUserName">Usuario</span>
                    <a href="login.html" class="logout-link" id="logoutLink">Cerrar sesión</a>
                </div>
            </div>
        </aside>

        <!-- ========== SECCIÓN: Contenido / resumen (.main-content · dashboard-styles.css) ========== -->
        <main class="main-content">
            <!-- Item: texto bienvenida (.dashboard-header) -->
            <div class="dashboard-header">
                <h2 id="welcomeTitle">Bienvenido de vuelta</h2>
                <p>Aquí tienes un resumen de tu actividad reciente</p>
            </div>

            <!-- Item: tarjetas KPI (.dashboard-cards · .card · .card-icon · .card-info) -->
            <div class="dashboard-cards">
                <div class="card">
                    <div class="card-icon blue">
                        <i class="fas fa-car"></i>
                    </div>
                    <div class="card-info">
                        <h3>Vehículos Registrados</h3>
                        <p class="card-number" id="cardVehiculos">0</p>
                        <a href="vehicles.html" class="card-link">Ver todos</a>
                    </div>
                </div>

                <div class="card">
                    <div class="card-icon green">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div class="card-info">
                        <h3>Próxima Cita</h3>
                        <p class="card-number" id="cardProximaCita">—</p>
                        <a href="appointments.html" class="card-link">Ver todas</a>
                    </div>
                </div>

                <div class="card">
                    <div class="card-icon orange">
                        <i class="fas fa-tools"></i>
                    </div>
                    <div class="card-info">
                        <h3>Citas Activas</h3>
                        <p class="card-number" id="cardCitasActivas">0</p>
                        <a href="appointments.html" class="card-link">Ver todas</a>
                    </div>
                </div>
            </div>

            <!-- Item: Kanban citas (.services-board · .board-column · .column-header) -->
            <div class="services-board">
                <h3>Mis Citas</h3>

                <div class="board-container">
                    <div class="board-column" id="colPendiente">
                        <div class="column-header">
                            <h4>Pendiente</h4>
                            <span class="badge" id="badgePendiente">0</span>
                        </div>
                        <div class="column-cards" id="cardsPendiente"></div>
                    </div>

                    <div class="board-column" id="colEnProgreso">
                        <div class="column-header">
                            <h4>En Progreso</h4>
                            <span class="badge" id="badgeEnProgreso">0</span>
                        </div>
                        <div class="column-cards" id="cardsEnProgreso"></div>
                    </div>

                    <div class="board-column" id="colFinalizado">
                        <div class="column-header">
                            <h4>Finalizado</h4>
                            <span class="badge" id="badgeFinalizado">0</span>
                        </div>
                        <div class="column-cards" id="cardsFinalizado"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        (function() {
            var u = FixMyCar.getUsuario();
            if (!u) { window.location.href = 'login.html'; return; }
            if (u.role === 'TALLER') { window.location.href = 'workshop-dashboard.html'; return; }
            var nameEl = document.getElementById('sidebarUserName');
            if (nameEl) nameEl.textContent = u.nombre || u.username;
            document.getElementById('logoutLink').addEventListener('click', function(e) {
                e.preventDefault();
                FixMyCar.logout();
                window.location.href = 'login.html';
            });
        })();
    </script>
    <script src="js/dashboard.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

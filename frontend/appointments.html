<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas - FixMyCar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard-styles.css">
    <link rel="stylesheet" href="css/vehicles-styles.css">
</head>
<body class="dashboard">
    <div class="dashboard-container">
        <!-- ========== SECCIÓN: Barra lateral cliente ========== -->
        <aside class="sidebar" id="sidebar">
            <!-- Item: marca (.logo-container) -->
            <div class="logo-container">
                <div class="logo-circle"><i class="fas fa-car"></i></div>
                <h1>FixMyCar</h1>
            </div>
            <!-- Item: menú (.sidebar-nav) -->
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Inicio</span></a>
                <a href="vehicles.html" class="nav-item"><i class="fas fa-car"></i><span>Mis Vehículos</span></a>
                <a href="search-workshops.html" class="nav-item"><i class="fas fa-search"></i><span>Buscar Taller</span></a>
                <a href="appointments.html" class="nav-item active"><i class="fas fa-calendar-alt"></i><span>Mis Citas</span></a>
            </nav>
            <!-- Item: perfil (.user-profile) -->
            <div class="user-profile">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-info">
                    <span class="user-name" id="sidebarUserName">Usuario</span>
                    <a href="login.html" class="logout-link" id="logoutLink">Cerrar sesión</a>
                </div>
            </div>
        </aside>
        <!-- ========== SECCIÓN: Mis citas (vehicles-styles + dashboard + inline donde aplica) ========== -->
        <main class="main-content">
            <div class="vehicles-container" style="padding: 20px 30px;">
                <!-- Item: cabecera (.dashboard-header) -->
                <div class="dashboard-header">
                    <h2>Mis Citas</h2>
                    <p>Gestioná tus turnos en talleres</p>
                </div>
                <!-- Item: acciones nueva cita (.vehicles-actions) -->
                <div class="vehicles-actions" style="margin-bottom: 24px;">
                    <h3>Solicitar nuevo turno</h3>
                    <button type="button" class="btn-primary" id="btnNuevaCita"><i class="fas fa-plus"></i> Nueva cita</button>
                </div>
                <!-- Item: formulario nuevo turno (#formCita — estilos parcialmente inline) -->
                <div class="search-results" style="margin-top: 0;">
                    <form id="formCita" style="display:none; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px;">
                        <h4 style="margin: 0 0 16px 0;">Datos del turno</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="citaTaller">Taller</label>
                                <select id="citaTaller" required>
                                    <option value="">Seleccionar taller...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="citaVehiculo">Vehículo</label>
                                <select id="citaVehiculo" required>
                                    <option value="">Seleccionar vehículo...</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="citaFecha">Fecha y hora</label>
                                <input type="datetime-local" id="citaFecha" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="citaDescripcion">Descripción (opcional)</label>
                            <textarea id="citaDescripcion" rows="2" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:6px;" placeholder="Ej: Cambio de aceite, revisión"></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-secondary" id="btnCancelarCita">Cancelar</button>
                            <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Solicitar turno</button>
                        </div>
                    </form>
                </div>
                <!-- Item: listado próximas citas (#citasList) -->
                <h3 style="margin: 20px 0 12px 0; color: #2c3e50;">Próximas citas</h3>
                <div id="citasList" class="vehicles-grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));"></div>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/appointments.js"></script>
</body>
</html>

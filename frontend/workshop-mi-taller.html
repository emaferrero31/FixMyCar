<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi taller - FixMyCar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/workshop-dashboard-styles.css">
    <link rel="stylesheet" href="css/workshop-edit-profile-styles.css">
    <link rel="stylesheet" href="css/workshop-mi-taller.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard">
    <!-- ========== SECCIÓN: Menú móvil ========== -->
    <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
    </button>

    <div class="dashboard-container">
        <!-- ========== SECCIÓN: Barra lateral taller ========== -->
        <aside class="sidebar" id="sidebar">
            <!-- Item: marca -->
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fas fa-car"></i>
                </div>
                <h1>FixMyCar</h1>
            </div>
            <!-- Item: menú (.sidebar-nav) -->
            <nav class="sidebar-nav">
                <a href="workshop-dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a href="workshop-appointments.html" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Gestión de Turnos</span>
                </a>
                <a href="workshop-inventory.html" class="nav-item">
                    <i class="fas fa-boxes"></i>
                    <span>Control de Stock</span>
                </a>
                <a href="workshop-mi-taller.html" class="nav-item active">
                    <i class="fas fa-store"></i>
                    <span>Mi taller</span>
                </a>
            </nav>

            <!-- Item: perfil (.user-profile) -->
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <span class="user-name" id="sidebarUserName">Taller</span>
                    <a href="login.html" class="logout-link" id="logoutLink">Cerrar sesión</a>
                </div>
            </div>
        </aside>

        <!-- ========== SECCIÓN: Vista solo lectura Mi taller ========== -->
        <main class="main-content">
            <div class="edit-profile-container mi-taller-vista">
                <!-- Item: título + enlace editar (.mi-taller-toolbar) -->
                <div class="mi-taller-toolbar">
                    <div>
                        <h1 class="mi-taller-h1">Información de mi taller</h1>
                    </div>
                    <a href="workshop-edit-profile.html" class="btn btn-primary mi-taller-btn-editar">
                        <i class="fas fa-user-edit"></i> Editar perfil
                    </a>
                </div>

                <p class="mi-taller-loading" id="miTallerLoading">Cargando datos del taller…</p>
                <p class="mi-taller-error" id="miTallerError" hidden></p>

                <!-- Item: bloque cuando hay datos (.profile-header · .edit-form en solo lectura) -->
                <div id="miTallerContent" hidden>
                    <div class="profile-header">
                        <div class="cover-photo">
                            <img src="" alt="Portada del taller" id="vCoverPreview">
                        </div>
                        <div class="profile-avatar">
                            <div class="avatar-container">
                                <img src="" alt="Logo del taller" id="vAvatarPreview">
                            </div>
                        </div>
                    </div>

                    <div class="edit-form">
                        <div class="form-section">
                            <h2>Información Básica</h2>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Nombre del Taller</label>
                                    <div class="view-value" id="vNombre"></div>
                                </div>
                                <div class="form-group">
                                    <label>Correo electrónico</label>
                                    <div class="view-value"><a id="vEmail" href="#"></a></div>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Teléfono</label>
                                    <div class="view-value"><a id="vTelefono" href="#"></a></div>
                                </div>
                                <div class="form-group">
                                    <label>Sitio web</label>
                                    <div class="view-value"><a id="vWeb" href="#" target="_blank" rel="noopener"></a></div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Dirección</label>
                                <div class="view-value" id="vDireccion"></div>
                            </div>
                            <div class="form-group">
                                <label>Usuario de acceso</label>
                                <div class="view-value view-muted" id="vUsername"></div>
                            </div>
                            <div class="form-group">
                                <label>Enlace de Google Maps</label>
                                <div class="view-value"><a id="vMaps" href="#" target="_blank" rel="noopener"></a></div>
                            </div>
                            <div class="form-group">
                                <label>Descripción del Taller</label>
                                <div class="view-value view-multiline" id="vDescripcion"></div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h2>Contacto y Redes Sociales</h2>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>WhatsApp</label>
                                    <div class="view-value"><a id="vWhatsapp" href="#" target="_blank" rel="noopener"></a></div>
                                </div>
                                <div class="form-group">
                                    <label>Facebook</label>
                                    <div class="view-value"><a id="vFacebook" href="#" target="_blank" rel="noopener"></a></div>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Instagram</label>
                                    <div class="view-value" id="vInstagram"></div>
                                </div>
                                <div class="form-group">
                                    <label>Twitter / X</label>
                                    <div class="view-value" id="vTwitter"></div>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="section-header">
                                <h2>Horario de Atención</h2>
                            </div>
                            <div class="schedule-container" id="vScheduleContainer"></div>
                        </div>

                        <div class="form-section">
                            <h2>Servicios Ofrecidos</h2>
                            <div class="service-tags-view" id="vServicesContainer"></div>
                        </div>

                        <div class="form-section">
                            <h2>Galería de Fotos</h2>
                            <div class="gallery-container" id="vGalleryContainer"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/workshop-mi-taller.js"></script>
</body>
</html>

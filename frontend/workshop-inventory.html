<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Stock - FixMyCar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/workshop-dashboard-styles.css">
    <link rel="stylesheet" href="css/workshop-inventory-styles.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard">
    <!-- ========== SECCIÓN: Menú móvil (.menu-toggle) ========== -->
    <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
    </button>
    
    <div class="dashboard-container">
        <!-- ========== SECCIÓN: Barra lateral taller ========== -->
        <aside class="sidebar" id="sidebar">
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fas fa-car"></i>
                </div>
                <h1>FixMyCar</h1>
            </div>

            <nav class="sidebar-nav">
                <a href="workshop-dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a href="workshop-appointments.html" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Gestión de Turnos</span>
                </a>
                <a href="workshop-inventory.html" class="nav-item active">
                    <i class="fas fa-boxes"></i>
                    <span>Control de Stock</span>
                </a>
                <a href="workshop-mi-taller.html" class="nav-item">
                    <i class="fas fa-store"></i>
                    <span>Mi taller</span>
                </a>
            </nav>

            <!-- Item: perfil (.user-profile) -->
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <span class="user-name" id="sidebarUserName">Taller</span>
                    <a href="login.html" class="logout-link" id="logoutLink">Cerrar sesión</a>
                </div>
            </div>
        </aside>

        <!-- ========== SECCIÓN: Inventario (main · filtros · .inventory-container) ========== -->
        <main class="main-content">
            <!-- Item: título (.top-bar) -->
            <header class="top-bar">
                <div class="page-title">
                    <h1>Gestión de Inventario</h1>
                    <p>Administra el stock de repuestos y suministros</p>
                </div>
            </header>

            <!-- Item: búsqueda y filtros stock (.filters-container) -->
            <div class="filters-container">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-inventory" placeholder="Buscar por nombre, código o categoría...">
                </div>
                
                <div class="filters-row">
                    <div class="filter-group">
                        <label for="category-filter">Categoría:</label>
                        <select id="category-filter" class="filter-select">
                            <option value="all">Todas las categorías</option>
                            <option value="motor">Motor</option>
                            <option value="frenos">Frenos</option>
                            <option value="suspension">Suspensión</option>
                            <option value="electrico">Eléctrico</option>
                            <option value="lubricantes">Lubricantes</option>
                            <option value="filtros">Filtros</option>
                            <option value="herramientas">Herramientas</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="stock-filter">Estado de stock:</label>
                        <select id="stock-filter" class="filter-select" title="Sin stock: 0 uds. Crítico y bajo se calculan con el stock mínimo de cada producto (formulario).">
                            <option value="all">Todo el stock</option>
                            <option value="low">Stock bajo</option>
                            <option value="critical">Stock crítico</option>
                            <option value="out">Sin stock</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-primary" id="add-item">
                        <i class="fas fa-plus"></i> Nuevo Item
                    </button>
                </div>
            </div>

            <!-- Item: tabla stock (.inventory-container · .inventory-table) -->
            <div class="inventory-container">
                <div class="inventory-header">
                    <div class="inventory-stats"></div>
                    
                    <div class="inventory-actions">
                        <button class="btn btn-icon" id="export-inventory" title="Exportar">
                            <i class="fas fa-file-export"></i>
                        </button>
                        <button class="btn btn-icon" id="print-inventory" title="Imprimir">
                            <i class="fas fa-print"></i>
                        </button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="inventory-table">
                        <thead>
                            <tr>
                                <th class="checkbox-cell">
                                    <input type="checkbox" id="select-all">
                                </th>
                                <th class="item-col">Producto</th>
                                <th class="category-col">Categoría</th>
                                <th class="stock-col">Stock</th>
                                <th class="price-col">Precio</th>
                                <th class="status-col">Estado</th>
                                <th class="actions-col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Item: acciones masivas (.floating-actions) -->
            <div class="floating-actions" id="bulkActions" style="display: none;">
                <div class="selected-count">
                    <span id="selectedItemsCount">0</span> elementos seleccionados
                </div>
                <div class="action-buttons">
                    <button class="btn btn-icon" id="export-selected">
                        <i class="fas fa-file-export"></i> Exportar
                    </button>
                    <button class="btn btn-icon btn-danger" id="delete-selected">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- ========== SECCIÓN: Modal producto (#product-modal · workshop-inventory-styles.css) ========== -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Nuevo Producto</h3>
                <button class="btn-icon close-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="product-name">Nombre del Producto *</label>
                            <input type="text" id="product-name" required>
                        </div>
                        <div class="form-group">
                            <label for="product-sku">Código SKU *</label>
                            <input type="text" id="product-sku" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="product-category">Categoría *</label>
                            <select id="product-category" required>
                                <option value="">Seleccionar categoría</option>
                                <option value="motor">Motor</option>
                                <option value="frenos">Frenos</option>
                                <option value="suspension">Suspensión</option>
                                <option value="electrico">Eléctrico</option>
                                <option value="lubricantes">Lubricantes</option>
                                <option value="filtros">Filtros</option>
                                <option value="herramientas">Herramientas</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="product-supplier">Proveedor</label>
                            <input type="text" id="product-supplier">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="product-stock">Stock actual *</label>
                            <input type="number" id="product-stock" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="product-min-stock">Stock mínimo *</label>
                            <input type="number" id="product-min-stock" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="product-max-stock">Stock máximo</label>
                            <input type="number" id="product-max-stock" min="0">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="product-price">Precio de compra</label>
                            <div class="input-with-icon">
                                <span class="input-prefix">$</span>
                                <input type="number" id="product-price" min="0" step="0.01">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="product-sale-price">Precio de venta *</label>
                            <div class="input-with-icon">
                                <span class="input-prefix">$</span>
                                <input type="number" id="product-sale-price" min="0" step="0.01" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="product-description">Descripción</label>
                        <textarea id="product-description" rows="3"></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary close-modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/workshop-inventory.js"></script>
</body>
</html>

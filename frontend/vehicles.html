<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Vehículos - FixMyCar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vehicles-styles.css">
</head>
<body class="dashboard">
    <div class="dashboard-container">
        <!-- ========== SECCIÓN: Barra lateral cliente (.sidebar · vehicles-styles.css) ========== -->
        <aside class="sidebar" id="sidebar">
            <!-- Item: marca (.logo-container · .logo-circle) -->
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fas fa-tools"></i>
                </div>
                <h1>FixMyCar</h1>
            </div>

            <!-- Item: menú (.sidebar-nav · .nav-item) -->
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a href="vehicles.html" class="nav-item active">
                    <i class="fas fa-car"></i>
                    <span>Mis Vehículos</span>
                </a>
                <a href="search-workshops.html" class="nav-item">
                    <i class="fas fa-search"></i>
                    <span>Buscar Taller</span>
                </a>
                <a href="appointments.html" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Mis Citas</span>
                </a>
            </nav>

            <!-- Item: perfil usuario pie sidebar (.user-profile) -->
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <span class="user-name" id="sidebarUserName">Usuario</span>
                    <a href="login.html" class="logout-link" id="logoutLink">Cerrar sesión</a>
                </div>
            </div>
        </aside>

        <!-- ========== SECCIÓN: Lista de vehículos (.vehicles-container · vehicles-styles.css) ========== -->
        <main class="main-content">
            <div class="vehicles-container">
                <!-- Item: cabecera (.dashboard-header · dashboard-styles.css) -->
                <div class="dashboard-header">
                    <h2>Mis Vehículos</h2>
                    <p>Administra tus vehículos registrados</p>
                </div>

                <!-- Item: acciones lista (.vehicles-actions · #addVehicleBtn) -->
                <div class="vehicles-actions">
                    <h3>Lista de Vehículos</h3>
                    <button class="btn-primary" id="addVehicleBtn">
                        <i class="fas fa-plus"></i> Agregar Vehículo
                    </button>
                </div>
                <!-- Item: rejilla de tarjetas (#vehiclesList) -->
                <div id="vehiclesList" class="vehicles-grid"></div>
            </div>
        </main>
    </div>

    <!-- ========== SECCIÓN: Modal alta/edición (.modal · vehicles-styles.css) ========== -->
    <div class="modal" id="vehicleModal">
        <div class="modal-content">
            <!-- Item: encabezado (.modal-header · #modalTitle · #closeModal) -->
            <div class="modal-header">
                <h3 id="modalTitle">Agregar Vehículo</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <!-- Item: formulario datos (#vehicleForm · .form-row · .vehicle-photo-group) -->
            <div class="modal-body">
                <form id="vehicleForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="brand">Marca</label>
                            <div class="input-with-icon">
                                <input type="text" id="brand" name="brand" placeholder="Ej: Toyota" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="model">Modelo</label>
                            <div class="input-with-icon">
                                <input type="text" id="model" name="model" placeholder="Ej: Corolla" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="year">Año</label>
                            <div class="input-with-icon">
                                <input type="number" id="year" name="year" min="1900" max="2030" placeholder="Ej: 2020" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="licensePlate">Placa</label>
                            <div class="input-with-icon">
                                <input type="text" id="licensePlate" name="licensePlate" placeholder="Ej: ABC-1234" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="color">Color</label>
                            <div class="input-with-icon">
                                <input type="text" id="color" name="color" placeholder="Ej: Rojo" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="fuelType">Tipo de Combustible</label>
                            <div class="input-with-icon">
                                <select id="fuelType" name="fuelType" required>
                                    <option value="">Seleccione...</option>
                                    <option value="Gasolina">Gasolina</option>
                                    <option value="Diésel">Diésel</option>
                                    <option value="Híbrido">Híbrido</option>
                                    <option value="Eléctrico">Eléctrico</option>
                                    <option value="Gas">Gas</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="mileage">Kilometraje</label>
                            <div class="input-with-icon">
                                <input type="text" id="mileage" name="mileage" placeholder="Ej: 45,000 km" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="vin">Número de Serie (VIN)</label>
                            <div class="input-with-icon">
                                <input type="text" id="vin" name="vin" placeholder="Opcional">
                            </div>
                        </div>
                    </div>

                    <div class="form-group vehicle-photo-group">
                        <label for="vehiclePhoto">Foto del vehículo <span class="label-optional">(opcional)</span></label>
                        <div class="vehicle-photo-row">
                            <input type="file" id="vehiclePhoto" accept="image/jpeg,image/png,image/webp">
                            <button type="button" class="btn-secondary btn-sm" id="vehiclePhotoClear">Quitar foto</button>
                        </div>
                        <p class="vehicle-photo-hint">Se guarda en el servidor como imagen reducida (JPG). Máx. recomendado 4 MB al elegir archivo.</p>
                        <div class="vehicle-photo-preview" id="vehiclePhotoPreview" hidden>
                            <img id="vehiclePhotoPreviewImg" src="" alt="Vista previa">
                        </div>
                    </div>

                    <!-- Item: botones Cancelar / Guardar (.form-actions) -->
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="cancelBtn">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-save"></i> Guardar Vehículo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/vehicles.js"></script>
</body>
</html>

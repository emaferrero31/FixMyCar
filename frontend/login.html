<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - FixMyCar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <!-- ========== SECCIÓN: Tarjeta de login (.login-container · css/style.css) ========== -->
    <div class="login-container">
        <!-- Item: encabezado con marca (.login-logo) -->
        <div class="login-logo">
            <i class="fas fa-car"></i>
            <h1>FixMyCar</h1>
            <p>Iniciar Sesión</p>
        </div>
        <!-- Item: formulario (.login-form · .form-group · .form-control · .btn-login) -->
        <div class="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
            <!-- Item: enlace a registro (.register-link) -->
            <div class="register-link">
                ¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            var body = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            fetch(FixMyCar.API_BASE + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
            .then(function(result) {
                if (result.ok) {
                    FixMyCar.setUsuario(result.data);
                    FixMyCar.redirectPorRol(result.data);
                } else {
                    alert(result.data.message || 'Usuario o contraseña incorrectos');
                    btn.disabled = false;
                }
            })
            .catch(function() {
                alert('Error de conexión. ¿Está el backend en marcha?');
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taller_mecanico
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: your-jwt-secret-key-here
    expiration: 86400000 # 24 horas en milisegundos
